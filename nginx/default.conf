# nginx chạy trên HOST nên gọi container qua cổng đã publish ở 127.0.0.1
# (docker-compose: 127.0.0.1:3000 -> frontend, 127.0.0.1:8080 -> backend).
# Tên "frontend"/"backend" chỉ phân giải được bên trong mạng Docker, host không hiểu.

# Chỉ gửi "Connection: upgrade" khi request thật sự là WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- Cổng 80: giữ đường dẫn ACME cho certbot, còn lại chuyển sang HTTPS ----------
server {
    listen 80;
    server_name hloi0408.click www.hloi0408.click;

    # Certbot (webroot) cần đường này để xin và gia hạn chứng chỉ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Cổng 443: Cloudflare (Full strict) kết nối vào đây ----------
server {
    listen 443 ssl;
    server_name hloi0408.click www.hloi0408.click;

    ssl_certificate     /etc/letsencrypt/live/hloi0408.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hloi0408.click/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 1. Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. API xuống Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Health check xuống Backend
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
