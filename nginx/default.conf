server {
    listen 80;
    server_name hloi0408.click www.hloi0408.click;

    # 1. Đưa Frontend (Next.js) 
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        
        # Bật WebSocket / Hot Reload cho Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Điều hướng các request gọi API (/api/) xuống Backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Điều hướng đường dẫn kiểm tra sức khỏe (/health) xuống Backend
    location = /health {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
