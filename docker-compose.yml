services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: team-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8880:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
